# Local Supabase config for Achordeon — Epic 9 (Audience & lobby).
# Run the local stack with `supabase start`. The live lobby path uses only
# Realtime Presence (no database); the database here backs the append-only
# `lobby_events` analytics table (ADR-0003).

project_id = "achordeon"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# The app is served under /app/ (the docs site owns the root), and OAuth /
# confirmation links return to the exact page that started the flow (AuthService
# `redirectTo`), so the allow-list needs the path wildcard, not a bare origin —
# a non-matching redirect_to is silently replaced by site_url. The hosted project
# keeps the same list under Dashboard ▸ Authentication ▸ URL Configuration, with
# site_url = https://achordeon.eu/app/.
site_url = "http://127.0.0.1:4200/app/"
additional_redirect_urls = [
  "http://127.0.0.1:4200/**",
  "http://localhost:4200/**",
  "https://achordeon.eu/**",
]
jwt_expiry = 3600
enable_signup = true
# Epic 10 (ADR-0009): the user may deliberately add a second sign-in method to
# the account they are logged into (`linkIdentity` / `updateUser`). Automatic
# same-verified-email linking is on regardless — it cannot be disabled — so this
# flag only unlocks the *explicit* add-a-method flow surfaced in Settings.
enable_manual_linking = true

[auth.email]
enable_signup = true
# Email confirmation is REQUIRED, not a UX preference (ADR-0009): an unconfirmed
# email/password identity grants no session and never auto-links, which is the
# precondition that makes add-method linking safe against account-takeover.
# Locally the confirmation mail lands in Inbucket (port 54324).
enable_confirmations = true

# Google is the first-class provider (PRD-INFRASTRUCTURE.md §5): OAuth sign-in and
# the carrier for "Connect Drive" (the `drive.file` scope rides this identity,
# ADR-0009). Secrets come from the environment so none sit in the repo; locally,
# leaving them unset just means the Google button no-ops until real credentials
# are supplied.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
