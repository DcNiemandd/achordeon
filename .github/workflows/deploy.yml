name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Where the deployed site lives. Set these as repo *variables* (Settings ▸
  # Secrets and variables ▸ Actions ▸ Variables) to move the site without
  # touching the repo; the literals after `||` are the fallback, so a fork — or
  # a checkout where nobody set the variables — still builds a coherent site
  # rather than one with an empty base path.
  #
  # The domain itself is claimed by `apps/docs/static/CNAME`, which Docusaurus
  # copies to the site root for Pages to read. These four only say where the two
  # apps think they live: docs at the root, app one level under it.
  DOCS_URL: ${{ vars.DOCS_URL || 'https://achordeon.eu' }}
  DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}
  APP_BASE_HREF: ${{ vars.APP_BASE_HREF || '/app/' }}
  APP_LINK: ${{ vars.APP_LINK || '/app/' }}

jobs:
  verify:
    name: Verify (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx affected base
        if: github.event_name == 'pull_request'
        run: echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Test
        run: pnpm exec nx run-many -t test --configuration=ci

      - name: Build (verification only)
        run: pnpm exec nx run-many -t build --projects=app,docs
        env:
          # Public anon key — RLS is the guard, not secrecy (ADR-0003). Set as
          # repo *variables* (Settings ▸ Secrets and variables ▸ Actions ▸
          # Variables). Unset → GitHub passes '', which builds the app
          # offline-only (Audience unavailable) rather than pointing prod at
          # localhost.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Also a repo variable, and deliberately without a literal fallback: a
          # fork that builds this workflow would otherwise count its own traffic
          # into someone else's GoatCounter site. Unset → no beacon, no CSP entry
          # for it. Passed here too so the verification build produces the same
          # index and Content-Security-Policy the deploy does.
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, because the sitemaps' `<lastmod>` is read out of
          # git: Docusaurus asks when each page's source file was last committed.
          # A shallow clone has one commit, so every page would be stamped with
          # the day of the deploy — and a sitemap where everything changed today,
          # every day, is a freshness signal that says nothing.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docusaurus
        run: pnpm exec nx build docs
        env:
          DOCS_URL: ${{ env.DOCS_URL }}
          DOCS_BASE_URL: ${{ env.DOCS_BASE_URL }}
          APP_LINK: ${{ env.APP_LINK }}
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
          # Writes `<key>.txt` at the site root, which is what proves to Bing,
          # Seznam and Yandex that the pinger below owns this host. A repo
          # variable, not a secret — the file is public by design. Unset means no
          # file and no ping, so a fork submits nothing.
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}

      - name: Build Angular app
        run: pnpm exec nx build app --base-href=$APP_BASE_HREF
        env:
          # Public anon key (ADR-0003) — repo variables, not secrets.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}

      - name: Assemble site
        run: |
          mkdir -p dist/site
          cp -r apps/docs/build/. dist/site/
          mkdir -p dist/site/app
          cp -r dist/apps/app/browser/. dist/site/app/
          # GitHub Pages serves this root 404 for every miss (there is no
          # per-app 404), so it carries the SPA fallback that reloads an app
          # deep link back into the app instead of the Docusaurus 404. The app is
          # one bundle for every language (PRD-INFRASTRUCTURE.md §11), so there
          # is a single app root to bounce to.
          node tools/spa-github-404.mjs dist/site/404.html "$APP_BASE_HREF"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # After the deploy, never before it: a URL submitted while the old page is
      # still being served buys a crawl of the old page. Reads the URLs out of
      # the sitemaps that were just built, so the two cannot disagree.
      #
      # `continue-on-error`, because this is an announcement and not part of
      # shipping. The site is live by this point; a rate limit or an outage at
      # someone else's API must not paint the deploy red.
      #
      # Which leaves no room for a red step to mean anything, so the script says
      # it another way: a 403 or a 429 — the two answers that mean the
      # submission was refused and someone here has to act — is written as a
      # `::error::` annotation, and lands in the run summary.
      - name: Ping IndexNow (Bing, Seznam, Yandex)
        continue-on-error: true
        run: node tools/ping-indexnow.mjs dist/site
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          DOCS_URL: ${{ env.DOCS_URL }}
          DOCS_BASE_URL: ${{ env.DOCS_BASE_URL }}
